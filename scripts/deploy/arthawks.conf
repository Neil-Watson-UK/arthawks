<VirtualHost *:80>
	ServerName arthawks.com
	ServerAlias www.arthawks.com

	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "http"
	ProxyPass / http://127.0.0.1:3000/
	ProxyPassReverse / http://127.0.0.1:3000/

	ErrorLog ${APACHE_LOG_DIR}/arthawks-error.log
	CustomLog ${APACHE_LOG_DIR}/arthawks-access.log combined
</VirtualHost>
